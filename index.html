<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zixin (Summer) Fu — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2b1a10; --cream:#fff8e6; --wood:#c58b4c; --c:#e63946;
    --px:'Press Start 2P', monospace; --pix:'Pixelify Sans', monospace; --body:'Nunito', system-ui, sans-serif; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#7ec8f5;color:var(--ink);font-family:var(--body)}
  #scene{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;display:block}
  .pixbox{background:var(--cream);box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),
    inset 0 -4px 0 0 #e9d9b5;}
  header.top{position:fixed;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:5}
  .sign{pointer-events:auto;padding:12px 16px 14px}
  .sign h1.solo{font-size:16px;letter-spacing:.12em}
  .sign h1{font-family:var(--px);font-size:12px;letter-spacing:.06em;font-weight:400;line-height:1.5}
  .sign p{font-family:var(--pix);font-size:15px;margin-top:4px;color:#6b4b2f}
  .hud{display:flex;gap:16px;pointer-events:auto}
  .btn{font-family:var(--px);font-size:10px;padding:10px 12px 12px;border:0;cursor:pointer;color:var(--ink);background:#ffd166;
    box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 -3px 0 0 #e0a930;}
  .btn:hover{background:#ffe08f}
  .btn:active{transform:translateY(2px);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 3px 0 0 #e0a930}
  .btn:focus-visible{outline:3px dashed #fff;outline-offset:5px}
  .count{background:var(--cream);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 -3px 0 0 #e9d9b5}
  .hint{position:fixed;left:50%;top:92px;transform:translateX(-50%);font-family:var(--px);font-size:11px;color:#fff;text-align:center;line-height:1.9;
    text-shadow:2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink);z-index:4;pointer-events:none;width:min(92vw,720px);transition:opacity .5s}
  .hint .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  #tip{position:fixed;z-index:6;pointer-events:none;font-family:var(--px);font-size:10px;padding:8px 10px 10px;white-space:nowrap;
    transform:translate(-50%,-100%);display:none;background:var(--cream);
    box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
  #tip b{color:var(--tc);font-weight:400}
  .talk{position:fixed;z-index:6;pointer-events:none;font-family:var(--px);font-size:10px;line-height:1.6;padding:9px 12px 11px;background:#fff;
    white-space:nowrap;transform:translate(-50%,-100%);display:none;color:var(--ink);
    box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
  .talk::after{content:"";position:absolute;left:50%;bottom:-11px;width:12px;height:12px;background:#fff;transform:translateX(-50%) rotate(45deg);
    box-shadow:3px 3px 0 0 var(--ink)}
  .talk.on{display:block;animation:talkBob 1s steps(2) infinite}
  @keyframes talkBob{50%{transform:translate(-50%,calc(-100% - 4px))}}
  .talk b{color:#2f86c4;font-weight:400}
  .buddytalk{position:absolute;z-index:3;bottom:86px;pointer-events:none;font-family:var(--px);font-size:9px;line-height:1.7;padding:9px 11px 11px;
    background:#fff;max-width:220px;white-space:normal;transform:translateX(-50%) scale(0);transform-origin:50% 100%;transition:transform .18s steps(3);
    box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
  .buddytalk.on{transform:translateX(-50%) scale(1)}
  .walker canvas{cursor:pointer}
  #tip .newtag{display:block;font-size:8px;color:#c1121f;margin-bottom:6px}
  #tip small{display:block;font-family:var(--pix);font-size:13px;margin-top:4px;color:#6b4b2f}
  .water{transition:background .3s}
  .water.ready{background:#bfe6ff;box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 -3px 0 0 #7cc0ee}
  #toast{position:fixed;left:50%;top:150px;transform:translateX(-50%);z-index:9;padding:12px 16px 14px;font-family:var(--px);font-size:11px;line-height:1.6;
    text-align:center;max-width:90vw;display:none;pointer-events:none}
  #toast.on{display:block;animation:toastIn .35s steps(4)}
  @keyframes toastIn{0%{transform:translateX(-50%) translateY(-12px);opacity:0}100%{transform:translateX(-50%);opacity:1}}
  .finishbtn{position:fixed;right:18px;bottom:18px;z-index:6;text-align:center;line-height:1.5;background:#ff9fc4;
    box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 -3px 0 0 #e56f9d}
  .finishbtn:hover{background:#ffb8d4}
  .finishbtn small{display:block;font-family:var(--pix);font-size:13px;text-transform:none;margin-top:2px}
  #booth{position:fixed;inset:0;z-index:35;background:#FFEBF1;display:none;flex-direction:column}
  #booth.on{display:flex}
  .boothbar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px 16px;background:#1fb5a0;box-shadow:0 4px 0 0 var(--ink)}
  .boothbar span{font-family:var(--px);font-size:11px;color:#fff;text-shadow:2px 2px 0 var(--ink)}
  #booth iframe{flex:1;border:0;width:100%;background:#FFEBF1}
  #pop{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
  #pop img{position:absolute;left:0;top:0;will-change:transform,opacity;filter:drop-shadow(3px 3px 0 rgba(43,26,16,.28))}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  #wipe{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:30;display:none}

  .finale{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:7;text-align:center;padding:24px 28px 26px;display:none;max-width:90vw}
  .finale.on{display:block;animation:bounceIn .5s steps(5)}
  .finale h3{font-family:var(--px);font-weight:400;font-size:clamp(16px,3vw,26px);line-height:1.5}
  .finale p{font-family:var(--pix);font-size:17px;margin:10px 0 18px;color:#6b4b2f}
  @keyframes bounceIn{0%{transform:translate(-50%,-50%) scale(.4)}70%{transform:translate(-50%,-50%) scale(1.08)}100%{transform:translate(-50%,-50%) scale(1)}}

  /* ---------- project page ---------- */
  #sheet{position:fixed;inset:0;z-index:20;display:none;background:var(--cream);
    background-image:linear-gradient(#f3e8cc 2px,transparent 2px),linear-gradient(90deg,#f3e8cc 2px,transparent 2px);background-size:32px 32px}
  #sheet.open{display:block}
  .scroller{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain}
  .bar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 28px 22px;
    background:var(--c);box-shadow:0 4px 0 0 var(--ink)}
  .bar .crumb{font-family:var(--px);font-size:10px;color:#fff;text-shadow:2px 2px 0 var(--ink)}
  .sheet-in{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:56px;padding:48px 44px 80px;max-width:1500px;margin:0 auto}
  .info{position:sticky;top:110px;align-self:start;padding:26px 26px 28px}
  .num{font-family:var(--px);font-size:46px;color:var(--c);text-shadow:4px 4px 0 var(--ink);display:flex;align-items:center;gap:18px}
  .num canvas{width:56px;height:56px;image-rendering:pixelated}
  .info h2{font-family:var(--px);font-weight:400;font-size:20px;line-height:1.5;margin-top:20px}
  .kind{font-family:var(--pix);font-size:18px;color:#6b4b2f;margin-top:6px}
  .meta{margin-top:20px;padding-top:16px;border-top:4px dotted #d9c49a;font-family:var(--pix);font-size:16px;line-height:1.6}
  .meta div{display:flex;gap:10px}
  .meta div::before{content:"";width:8px;height:8px;background:var(--c);margin-top:8px;flex:none;box-shadow:2px 2px 0 var(--ink)}
  .desc{margin-top:18px;font-size:16px;line-height:1.7}
.flow{display:flex;flex-direction:column;gap:34px;margin-top:10px}
  .flowh{font-family:var(--px);font-weight:400;font-size:13px;color:var(--c);text-shadow:2px 2px 0 var(--ink)}
  .fstep{display:flex;align-items:center;gap:30px}
  .fstep.right{flex-direction:row-reverse}
  .fstep figure{flex:0 1 66%;max-width:66%;padding:10px}
  .fstep figure img{max-height:none;width:100%}
  .fstep.left figure{transform:rotate(-.6deg)}.fstep.right figure{transform:rotate(.6deg)}
  .fnote{flex:1;max-width:300px;padding:18px 20px 20px;background:var(--cream);
    box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
  .fnum{display:block;font-family:var(--px);font-size:26px;color:var(--c);text-shadow:3px 3px 0 var(--ink);margin-bottom:10px}
  .fnote b{font-family:var(--px);font-weight:400;font-size:12px}
  .fnote p{font-family:var(--pix);font-size:16px;line-height:1.5;margin-top:8px;color:#6b4b2f}
  @media (max-width:820px){.fstep,.fstep.right{flex-direction:column;align-items:stretch}.fstep figure{max-width:100%}.fnote{max-width:none}}
  .walker{position:relative;flex:1 1 auto;min-height:92px;margin-top:-14px;overflow:visible}
  .walker canvas{position:absolute;bottom:8px;left:0;width:64px;height:72px;image-rendering:pixelated}
  .walker::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:3px;background:repeating-linear-gradient(90deg,#d9c49a 0 6px,transparent 6px 12px)}
  .trybox{transform:rotate(-.8deg);padding:18px 18px 20px;background:color-mix(in srgb,var(--c) 18%,#fff);
    box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
  .trybox h4{font-family:var(--px);font-weight:400;font-size:11px;color:var(--c);text-shadow:2px 2px 0 var(--ink);margin-bottom:12px}
  .trybox a{display:inline-block;text-decoration:none}
  .trybox small{display:block;margin-top:12px;font-family:var(--pix);font-size:14px;color:#6b4b2f}
  .lists{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
  .lists h4{font-family:var(--px);font-weight:400;font-size:9px;line-height:1.6;margin-bottom:8px;color:var(--c);text-shadow:1px 1px 0 var(--ink)}
  .lists li{list-style:none;font-family:var(--pix);font-size:15px;line-height:1.55}
  .lists li::before{content:"▪ ";color:var(--c)}
  .gallery{display:flex;flex-direction:column;gap:36px;padding-top:6px}
  .gallery figure{background:#fff;padding:12px;box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),8px 8px 0 0 rgba(43,26,16,.18)}
  .gallery figure.hero-fig{align-self:flex-start;max-width:100%}
  .gallery>figure{align-self:flex-start;max-width:min(100%,820px)}
  .gallery>figure img{max-height:78vh;width:auto;max-width:100%}
  .toprow{display:flex;gap:30px;align-items:stretch}
  .herocol{flex:0 1 auto;max-width:58%;display:flex;flex-direction:column;gap:6px}
  .toprow .hero-fig{max-width:100%;align-self:flex-start}
  .herocol .walker{flex:0 0 auto}
  .side{flex:1 1 320px;min-width:300px;max-width:460px;display:flex;flex-direction:column;gap:34px}
  .diary{padding:22px 22px 24px;position:relative;transform:rotate(1.2deg)}
  .diary::before{content:"";position:absolute;top:-14px;left:50%;width:84px;height:22px;transform:translateX(-50%) rotate(-3deg);
    background:color-mix(in srgb,var(--c) 55%,#fff);opacity:.85;box-shadow:0 0 0 2px rgba(43,26,16,.15)}
  .diary h3{font-family:var(--px);font-weight:400;font-size:11px;letter-spacing:.06em;color:var(--c);text-shadow:2px 2px 0 var(--ink);margin-bottom:14px}
  .drow{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:10px 0;border-top:3px dotted #e2cfa3}
  .dk{font-family:var(--px);font-size:8px;line-height:1.8;padding-top:3px}
  .dv{font-family:var(--pix);font-size:16px;line-height:1.45}
  .emo{font-weight:400;font-size:20px;margin-right:8px;vertical-align:-2px}
  .hearts{color:var(--c);font-size:20px;letter-spacing:3px;text-shadow:1px 1px 0 var(--ink)}
  .hearts i{font-style:normal;color:#e7d7b4;text-shadow:none}
  .dnote{margin-top:12px;padding-top:12px;border-top:3px dotted #e2cfa3;font-family:var(--body);font-style:italic;font-size:15px;line-height:1.6;color:#6b4b2f}
  .gallery img{width:100%;display:block;cursor:zoom-in}
  .gallery .hero{width:auto;max-width:100%;max-height:72vh}
  .gallery figcaption{font-family:var(--pix);font-size:15px;margin-top:10px;color:#6b4b2f}
  #lightbox{position:fixed;inset:0;z-index:40;background:rgba(255,248,230,.97);display:none;align-items:center;justify-content:center;cursor:zoom-out;padding:3vw}
  #lightbox.on{display:flex}
  #lightbox img{max-width:100%;max-height:100%}

  @media (max-width:820px){
    .sign h1{font-size:9px}.sign p{font-size:13px}
    .btn{font-size:8px;padding:8px 9px 10px}
    .hud{gap:12px}
    .sheet-in{grid-template-columns:1fr;gap:30px;padding:28px 18px 60px}
    .info{position:static}
.toprow{flex-direction:column}.herocol{max-width:100%}.toprow .hero-fig{max-width:100%}.side{max-width:none}
    .bar{padding:14px 16px 16px}.bar .crumb{display:none}
    .num{font-size:34px}
    .hint{font-size:9px}
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="A pixel apple tree with six apples and a basket on the grass"></canvas>

<header class="top">
  <div></div>
  <div class="hud">
    <button class="btn" id="music" aria-pressed="true">♫ MUSIC</button>
    <button class="btn" id="sound" aria-pressed="true">♪ ON</button>
    <span class="btn count water" id="water" aria-live="polite">💧 THIRSTY</span>
    <span class="btn count" id="count" aria-live="polite">🍎 <span id="cn">0</span>/7</span>
  </div>
</header>

<div class="hint" id="hint">① WATER THE TREE &nbsp; ② PICK AN APPLE<span class="blink">_</span><br><span style="font-size:.8em">click the watering can — or drag it over the tree</span></div>
<div id="tip"></div>
<div id="canTalk" class="talk" aria-live="polite"></div>
<div id="toast" class="pixbox" role="status"></div>
<div id="pop" aria-hidden="true"></div>
<button class="btn finishbtn" id="finish">🧺 FINISH U-PICK<small>that’s all for today</small></button>
<div id="booth" role="dialog" aria-label="Sign GIF Booth"><div class="boothbar"><button class="btn" id="boothClose">← BACK TO THE ORCHARD</button><span>SIGN GIF BOOTH</span></div><iframe title="Sign GIF Booth" allow="camera; microphone; fullscreen; autoplay"></iframe></div>
<div class="sr" id="kb"></div>

<div class="finale pixbox" id="finale">
  <h3>THANK YOU FOR VISITING!</h3>
  <p id="finMsg">And thank you for helping Summer pick apples! 🍎</p>
  <button class="btn" id="again">GROW APPLES FOR THE NEXT VISITOR</button>
</div>

<section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
  <div class="scroller" id="scroller">
    <div class="bar">
      <button class="btn" id="close">← BACK TO THE TREE</button>
      <span class="crumb" id="crumb"></span>
      <button class="btn" id="next">NEXT APPLE →</button>
    </div>
    <div class="sheet-in">
      <aside class="info pixbox">
        <div class="num"><canvas id="sh-apple" width="9" height="9"></canvas><span id="sh-num"></span></div>
        <h2 id="sh-title"></h2>
        <div class="kind" id="sh-kind"></div>
        <div class="meta" id="sh-meta"></div>
        <p class="desc" id="sh-desc"></p>
        <div class="lists" id="sh-lists"></div>
        <div id="sh-tryleft"></div>
      </aside>
      <div class="gallery" id="sh-gallery"></div>
    </div>
  </div>
</section>
<canvas id="wipe"></canvas>
<div id="lightbox"><img alt=""></div>

<script>
/* ================= content ================= */
const PROJECTS = [
  { n:"01", title:"Balance", kind:"Public Architecture Design", pal:{o:'#e63946',h:'#ff8f8f',d:'#a4161a'},
    meta:["2nd year Design Studio","Individual project","2023.11 – 12","University of Toronto"],
    desc:"This project addresses the need for enhanced public spaces at the University of Toronto while exploring the concept of “Balance” through two distinct environments that enrich campus life. A dynamic public grandstand along the street offers indoor seating with views of the adjacent gymnasium, fostering social interaction and informal conversation. A quiet study area offers students a peaceful haven, planned with acoustics and natural light to cultivate a serene atmosphere. An underground diagonal passage serves as both a shortcut for students and an inviting entry point for visitors. Together, these spaces balance social connectivity and academic focus.",
    lists:[["Two spaces",["Public grandstand","Quiet study area","Underground diagonal passage"]]],
    hero:"img/hero1.jpg", gallery:[["img/g1_0.jpg","Spatial diagrams, plans & section — study area and public grandstand"],["img/g1_1.jpg","Model and interior renderings"]] },
  { n:"02", title:"The Bench", kind:"Furniture Design", pal:{o:'#f4c430',h:'#fff08a',d:'#c4850a'},
    meta:["3rd year Design Studio","Group project with Ana Kanyandekwe Andeme, Eda Sarac, Kallel Meister","2025.02 – 03"],
    desc:"A bench that extends the design idea of the “circle”, drawing inspiration from the natural forms of trees and the architectural structure on site. Its carved circular shape echoes natural forms and integrates into the landscape, becoming both functional and artistic — a dynamic focal point full of opportunities for interaction. Built to withstand all seasons with minimal maintenance, its concrete body creates a strong material connection to the built elements of the project.",
    lists:[["My contribution",["Exploded axonometric","1:1 model making","1:5 & 1:10 laser-cut sketch models","Material testing","Final file layout","Coating & wood frame","Model photography"]],["Materials",["Wood","Screws","Concrete","Plaster"]]],
    hero:"img/hero2.jpg", gallery:[["img/g2_0.jpg","Design process, exploded axonometric & perspectives"],["img/g2_1.jpg","Making the 1:1 bench — on site"]] },
  { n:"03", title:"The Blob Office", kind:"Office Building", pal:{o:'#f28c28',h:'#ffc078',d:'#b0520b'},
    meta:["2nd year Modelling & Fabrication Studio","Individual project","2024.03 – 04"],
    desc:"Starting from a fundamental “blob”, Grasshopper definitions progressively transform the form to exaggerate organic geometries, producing expressive and fluid interior spaces. A patterned, layered façade filters natural light into the interior, creating a warm and dynamic atmosphere. Natural wood textures and the play of light and shadow enhance spatial transparency, merging the built environment with nature for an immersive spatial experience.",
    lists:[["Materials",["Plywood","Acrylic","Superglue","Wooden columns","Human figures"]],["Tools",["Grasshopper","Laser cutting","Physical model"]]],
    hero:"img/hero3.jpg", gallery:[["img/g3_0.jpg","Exploded diagram and model photographs"]] },
  { n:"04", title:"Other Works", kind:"Drawings · Paintings · Photographs · Collages", pal:{o:'#9b5de5',h:'#d2adff',d:'#5a2c9c'},
    meta:["Class projects & personal works","2023.12 – 2025.10"],
    desc:"Hand drawings, paintings, collages and photographs keep me grounded in observation, emotion and storytelling. Drawing and painting sharpen my spatial sense, composition and material sensitivity. Through collage I reinterpret familiar imagery into new visual languages of personal emotion, pop culture and social reflection. Photography taught me to appreciate ordinary details — a city skyline, the tenderness of flowers, light reflected on a façade.",
    lists:[["Media",["Colored pencil & crayon","Watercolor & acrylic","Collage","Photography","Installation"]]],
    hero:"img/hero6.jpg", gallery:[["img/g6_0.jpg","Drawings & paintings — “The Shell”, “Him”, and more"],["img/g6_1.jpg","Collages and photographs"]] },
  /* ---------- Master's projects ---------- */
  { n:"05", title:"Sign GIF Booth", kind:"Interactive Sign-Language Booth · Master’s project", pal:{o:'#1fb5a0',h:'#9ff0e6',d:'#0e7a6c'}, grad:true,
    meta:["Master of Design","Collaboration with Jing","Interactive prototype"],
    desc:"Say it loud — join us! A sign-language GIF booth where visitors dress up, choose a backdrop, learn a sign from a fluent signer’s reference clip, record a three-second looping take, decorate it with captions, frames and stickers, then scan a QR code to keep their GIF — and add it to the studio collection. No sound is needed: every cue is visual, and the booth runs in English, Français and 中文.",
    lists:[],
    hero:"img/hero7.jpg", gallery:[],
    flow:[["img/booth1.jpg","START","Pick a language and tap to start."],
          ["img/booth2.jpg","LOOK","Dress up and choose a backdrop."],
          ["img/booth3.jpg","RECORD","Learn a sign, then record a 3-second loop."],
          ["img/booth4.jpg","DECORATE","Make it yours with captions, frames and stickers."],
          ["img/booth5.jpg","SAVE","Your sign GIF is ready!"],
          ["img/booth6.jpg","SCAN","Scan the QR code to take it home."]] },

const CIRCLES=[[0,0,1],[-.62,.22,.68],[.62,.18,.72],[0,-.48,.72],[-.32,.5,.62],[.32,.52,.6],[-.5,-.3,.55],[.5,-.32,.55]];
const SPOTS=[[-.62,-.18],[.05,-.66],[.66,-.12],[-.3,.36],[.36,.4],[-.92,.38],[.92,.3]];
function layout(){
  W=innerWidth;H=innerHeight;portrait=H>W*1.05;

  cy=Math.floor(gy-R*1.5);
  bw=Math.max(26,Math.floor(R*.9));bw+=bw%2;bh=Math.floor(bw*.42);
  bx=Math.floor(portrait?Math.min(LW-bw/2-4,LW*.76):Math.min(LW*.74,tx+R*2.4));
  bBottom=gy+Math.max(7,Math.floor((LH-gy)*(portrait?.45:.4)));

  apples.forEach(a=>{a.hx=tx+SPOTS[a.i][0]*R;a.hy=cy+SPOTS[a.i][1]*R;

function buildBg(){
  bg=mk(LW,LH);const b=bg.getContext('2d');
  const sky=['#6fc0f2','#83caf4','#97d4f6','#addff8','#c4e8f9','#dcf2fb'];
  for(let y=0;y<gy;y++){const f=y/gy*(sky.length-1), i=Math.floor(f), fr=f-i;
    for(let x=0;x<LW;x++){const di=(fr>.5&&((x+y)&1))||fr>.8?1:0;b.fillStyle=sky[Math.min(sky.length-1,i+di)];b.fillRect(x,y,1,1);}}

    if((x*7)%23===0){b.fillStyle='#7cc462';b.fillRect(x,h2+1,1,1);}}
  // ground
  for(let y=gy;y<LH;y++)for(let x=0;x<LW;x++){const r=hash(x,y);
    b.fillStyle=y===gy?'#a7e873':y===gy+1?'#86d85a':r<.12?'#5cae3f':r<.16?'#8bd45f':'#6cc04a';b.fillRect(x,y,1,1);}
  for(let x=0;x<LW;x++){if(hash(x,7)<.18){b.fillStyle='#6cc04a';b.fillRect(x,gy-1,1,1);if(hash(x,9)<.4){b.fillStyle='#86d85a';b.fillRect(x,gy-2,1,1);}}}

  for(let dy=-1;dy<2;dy++){const hw=Math.round((bw/2+4)*Math.sqrt(1-(dy/2)**2));b.fillRect(bx-hw,bBottom+dy,hw*2,1);}
  // flowers

    if(Math.abs(x-bx)<bw/2+3&&Math.abs(y-bBottom)<6)continue;

}
function buildCanopy(){
  const w=Math.ceil(R*2.9),h=Math.ceil(R*2.5);cox=Math.round(tx-w/2);coy=Math.round(cy-R*1.28);
  canopy=mk(w,h);const c=canopy.getContext('2d');canopyMask=new Uint8Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const X=x+cox-tx,Y=y+coy-cy;let inside=false;
    for(const[a,b2,r]of CIRCLES){const d=Math.hypot(X-a*R,Y-b2*R);if(d<r*R+(hash(x,y)-.5)*2.2){inside=true;break}}
    canopyMask[y*w+x]=inside?1:0;}
  const M=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&canopyMask[y*w+x];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(!M(x,y))continue;
    const X=(x+cox-tx)/R,Y=(y+coy-cy)/R;let col;
    if(!M(x-1,y)||!M(x+1,y)||!M(x,y-1)||!M(x,y+1))col='#1f5c2a';
    else{let l=-(X*.45+Y*.8)+(hash(x*2,y*3)-.5)*.35;
      // little leaf clusters
      const cl=Math.sin(x*.55)*Math.sin(y*.6);l+=cl*.18;
      const ch=((x+y)&1)?.06:-.06;l+=ch;
      col=l>.62?'#a5e66a':l>.22?'#6cc843':l>-.3?'#46a838':'#2f8030';}
    c.fillStyle=col;c.fillRect(x,y,1,1);}
}
function buildTrunk(){
  const tw=Math.max(6,Math.round(R*.26));const top=Math.round(cy+R*.1),bot=gy+3;
  trunk=mk(tw+8,bot-top+1);trunkX=tx-Math.floor(tw/2)-4;trunkY=top;const c=trunk.getContext('2d');
  for(let y=0;y<=bot-top;y++){const flare=y>bot-top-4?(4-(bot-top-y)):0;
    const x0=4-flare,x1=4+tw+flare;

}

/* ---------- star burst (hand-drawn) ---------- */
const STARS=['star_yellow','star_pink','star_teal','star_blue','star_green','star_purple','star_pink2'].map(n=>{const i=new Image();i.src=`fx/${n}.png`;return i.src;});
const RAY=(()=>{const i=new Image();i.src='fx/ray1.png';return i.src;})();
const popL=document.getElementById('pop');
function starBurst(sx,sy){
  const base=Math.max(46,Math.min(110,Math.min(W,H)*.1));const n=7,off=Math.random()*6.28;
  const order=[...STARS].sort(()=>Math.random()-.5);
  for(let i=0;i<n;i++){const el=document.createElement('img');el.src=order[i%order.length];el.alt='';
    const sz=base*(.55+Math.random()*.6);el.style.width=sz+'px';popL.appendChild(el);
    const ang=off+i/n*6.283+(Math.random()-.5)*.5,d=base*(1.1+Math.random()*1.1),dx=Math.cos(ang)*d,dy=Math.sin(ang)*d,rot=(Math.random()-.5)*260;
    const T=(x,y,sc,r)=>`translate(${sx+x}px,${sy+y}px) translate(-50%,-50%) rotate(${r}deg) scale(${sc})`;
    el.animate([{transform:T(0,0,0,0),opacity:1,easing:'cubic-bezier(.15,.9,.3,1)'},{transform:T(dx*.8,dy*.8,1.15,rot*.6),opacity:1,offset:.45,easing:'linear'},{transform:T(dx*.9,dy*.9+base*.1,1,rot*.8),opacity:1,offset:.7,easing:'ease-in'},{transform:T(dx,dy+base*.35,.7,rot),opacity:0}],
      {duration:1300+Math.random()*300,delay:Math.random()*60}).onfinish=()=>el.remove();}
  const rays=6,roff=Math.random()*6.28;
  for(let i=0;i<rays;i++){const el=document.createElement('img');el.src=RAY;el.alt='';el.style.width=base*.26+'px';popL.appendChild(el);
    const ang=roff+i/rays*6.283,deg=ang*180/Math.PI+90,c=Math.cos(ang),s=Math.sin(ang);
    const T=(d,sc)=>`translate(${sx+c*d}px,${sy+s*d}px) translate(-50%,-50%) rotate(${deg}deg) scale(${sc})`;
    el.animate([{transform:T(base*.45,.2),opacity:0,easing:'cubic-bezier(.2,.8,.3,1)'},{transform:T(base*.95,1),opacity:1,offset:.35},{transform:T(base*1.15,1),opacity:1,offset:.6,easing:'ease-in'},{transform:T(base*1.5,.6),opacity:0}],
      {duration:800}).onfinish=()=>el.remove();}
}

/* ================= pixel wipe ================= */
const wc=document.getElementById('wipe'),wg=wc.getContext('2d');
function wipe(color,mid,done){
  const cs=Math.max(22,Math.round(Math.min(W,H)/16)),cols=Math.ceil(W/cs),rows=Math.ceil(H/cs);
  wc.width=cols;wc.height=rows;wc.style.display='block';
  const ord=[...Array(cols*rows).keys()].sort(()=>Math.random()-.5);const T=360;let t0=performance.now(),phase=0;
  function step(now){const k=Math.min(1,(now-t0)/T),n=Math.floor(k*ord.length);
    if(phase===0){wg.fillStyle=color;for(let i=0;i<n;i++){const c=ord[i];wg.fillRect(c%cols,Math.floor(c/cols),1,1);}
      if(k>=1){phase=1;mid&&mid();ord.sort(()=>Math.random()-.5);t0=now;}}
    else{wg.fillStyle=color;wg.fillRect(0,0,cols,rows);for(let i=0;i<n;i++){const c=ord[i];wg.clearRect(c%cols,Math.floor(c/cols),1,1);}
      if(k>=1){wc.style.display='none';wg.clearRect(0,0,cols,rows);done&&done();return;}}
    requestAnimationFrame(step);}
  requestAnimationFrame(step);
}

/* ---------- playful background music (original chiptune loop) ---------- */
const music=(()=>{let on=true,playing=false,master=null,timer=null,step=0,nextT=0,ducked=false;
  const BPM=88,E=60/BPM/2; // gentle, music-box tempo
  // calm C-major pentatonic tune with little playful skips (0 = rest)
  const MEL=[76,0,79,0,81,79,76,0, 74,0,76,0,72,0,0,0, 72,0,74,76,79,0,76,74, 76,0,0,0,0,0,0,0,
             79,0,81,0,84,81,79,0, 76,0,79,76,74,0,0,0, 72,74,76,0,74,72,69,0, 72,0,0,0,0,0,0,0];
  const BASS=[48,0,0,0,55,0,0,0, 45,0,0,0,52,0,0,0, 41,0,0,0,48,0,0,0, 43,0,0,0,50,0,0,0];
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function bell(t,m,len,vol){const a=actx,o=a.createOscillator(),o2=a.createOscillator(),gn=a.createGain(),g2=a.createGain();
    o.type='sine';o.frequency.value=hz(m);o2.type='sine';o2.frequency.value=hz(m)*3;g2.gain.value=.18;
    gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+.008);gn.gain.exponentialRampToValueAtTime(.0001,t+len);
    o.connect(gn);o2.connect(g2).connect(gn);gn.connect(master);o.start(t);o2.start(t);o.stop(t+len+.05);o2.stop(t+len+.05);}
  function pad(t,m,len,vol){const a=actx,o=a.createOscillator(),gn=a.createGain(),f=a.createBiquadFilter();
    o.type='triangle';o.frequency.value=hz(m);f.type='lowpass';f.frequency.value=600;
    gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+.08);gn.gain.exponentialRampToValueAtTime(.0001,t+len);
    o.connect(f).connect(gn).connect(master);o.start(t);o.stop(t+len+.05);}
  function tick(t){const a=actx,o=a.createOscillator(),gn=a.createGain();o.type='sine';o.frequency.setValueAtTime(1800,t);o.frequency.exponentialRampToValueAtTime(900,t+.04);
    gn.gain.setValueAtTime(.12,t);gn.gain.exponentialRampToValueAtTime(.0001,t+.05);o.connect(gn).connect(master);o.start(t);o.stop(t+.06);}
  function sched(){while(nextT<actx.currentTime+.3){const m=MEL[step%MEL.length],bs=BASS[step%BASS.length];
      if(m)bell(nextT,m,E*2.6,.55);
      if(bs)pad(nextT,bs,E*3.8,.5);
      if(step%4===2)tick(nextT);
      if(step%32===28)bell(nextT,96,E*3,.12); // a tiny twinkle now and then
      nextT+=E;step++;}}
  function start(){if(!on||playing)return;const a=ac();if(!a)return;try{a.resume();}catch(_){}
    master=master||(()=>{const gn=a.createGain();gn.gain.value=0;gn.connect(a.destination);return gn})();
    master.gain.setTargetAtTime(ducked?0:.09,a.currentTime,.6);nextT=a.currentTime+.1;playing=true;timer=setInterval(sched,80);}
  function stop(){if(!playing)return;playing=false;clearInterval(timer);if(master)master.gain.setTargetAtTime(0,actx.currentTime,.15);}
  const btn=document.getElementById('music');
  btn.onclick=e=>{e.stopPropagation();on=!on;btn.textContent=on?'♫ MUSIC':'♫ OFF';btn.setAttribute('aria-pressed',on);on?start():stop();};
  addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('#music'))return;if(on&&!playing)start();},{capture:true});
  addEventListener('keydown',()=>{if(on&&!playing)start();},{capture:true});
  return {start,stop,duck(v){ducked=v;if(master&&actx)master.gain.setTargetAtTime(v?0:(playing?.09:0),actx.currentTime,.2);}};
})();

/* ---------- finish u-pick ---------- */
document.getElementById('finish').onclick=()=>{if(busy||openApple)return;ac();finale();};

/* finale */
const fin=document.getElementById('finale');
function finale(){if(fin.classList.contains('on'))return;document.getElementById('finMsg').textContent=basket.length===apples.length?'And thank you for helping Summer pick all the apples! 🍎':'And thank you for helping Summer pick apples! 🍎';fin.classList.add('on');sfx.fanfare();for(let i=0;i<4;i++)setTimeout(()=>sparkle(bx+(Math.random()-.5)*bw,bBottom-bh-6,PROJECTS[i%PROJECTS.length].pal,26),i*220);}
document.getElementById('again').onclick=()=>{fin.classList.remove('on');basket.length=0;document.getElementById('cn').textContent=0;
  apples.forEach((a,i)=>{a.state='tree';a.x=a.hx;a.y=a.hy;a.slot=-1;a.grow=.001;a.gt=performance.now()+i*180;});shake();setWater(false);setTimeout(()=>{canWiggleT=performance.now();toast('NEW APPLES! WATER THE TREE TO PICK 💧')},900);};

/* keyboard access */
const kb=document.getElementById('kb');
{const b=document.createElement('button');b.textContent='Water the tree';b.onfocus=()=>{kbFocus='can'};b.onblur=()=>{kbFocus=null;hideTip()};b.onclick=()=>{ac();if(can.state==='home')autoWater();};kb.appendChild(b);}
apples.forEach(a=>{const b=document.createElement('button');b.textContent=`Pick apple ${a.p.n}: ${a.p.title}`;
  b.onfocus=()=>{kbFocus=a};b.onblur=()=>{kbFocus=null;hideTip()};
  b.onclick=()=>{if(busy)return;ac();if(a.state==='basket')openProject(a);else collect(a,false);};kb.appendChild(b);});

/* tooltip */
const tip=document.getElementById('tip');
function showTip(a){if(a==='can'){tip.style.display='block';tip.style.setProperty('--tc','#2f6fae');
    tip.innerHTML=`<b>💧</b> WATERING CAN<small>${watered?'tree is watered — go pick!':'click it, or drag it over the tree'}</small>`;
    tip.style.left=can.x*S+'px';tip.style.top=(can.y-10)*S+'px';return;}
  tip.style.display='block';tip.style.setProperty('--tc',a.p.pal.d);
  tip.innerHTML=`${a.p.grad?'<span class="newtag">★ NEW · MASTER’S</span>':''}<b>${a.p.n}</b> ${a.p.title.toUpperCase()}<small>${a.state==='basket'?'click to open again':a.p.kind}</small>`;
  const tw=tip.offsetWidth;tip.style.left=Math.min(Math.max(a.x*S,tw/2+8),W-tw/2-8)+'px';tip.style.top=(a.y-8)*S+'px';}
function hideTip(){tip.style.display='none'}

/* ================= render loop ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(2.5,(now-last)/16.67);last=now;const t=now/1000;
  const st=(now-shakeT)/1000, shakeX=st<.9?Math.round(Math.sin(st*40)*2.2*(1-st/.9)):0;
  // physics
  for(const a of apples){
    if(a.state==='tree'){a.x=a.hx+shakeX;a.y=a.hy+(st<.9?Math.round(Math.abs(Math.sin(st*30+a.i))*1.2):0);
      if(a.grow>0&&a.grow<1){a.grow=Math.max(.001,Math.min(1,(now-a.gt)/400));if(a.grow>=1){a.grow=0;sparkle(a.x,a.y,a.p.pal,8);tone(880+a.i*90,.06,'square',.04);}}}
    else if(a.state==='fly'){const s=slotPos(a.slot),u=Math.min(1,(now-a.t0)/a.dur),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
      a.x=a.fx+(s.x-a.fx)*e;a.y=a.fy+(s.y-a.fy)*e-a.peak*4*u*(1-u);if(u>=1){a.x=s.x;a.y=s.y;landed(a);}}
    else if(a.state==='fall'){a.vy+=.16*dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.vx*=.97;
      if(!a.rot&&a.vy>0&&overBasket({x:a.x,y:a.y})&&a.y>bBottom-bh-6&&!busy){collect(a,true);continue;}
      const rest=gy+3;if(a.y>=rest){a.y=rest;if(a.vy>.8){a.vy*=-.42;sfx.thud();for(let i=0;i<4;i++)parts.push({k:'px',x:a.x,y:a.y+3,vx:(Math.random()-.5),vy:-Math.random()*.8,c:'#a7e873',life:.6});}else{a.vy=0;a.state=a.rot?'rot':'ground';a.rt=now;}}
      a.x=Math.min(Math.max(a.x,5),LW-5);}
    else if(a.state==='basket'){const s=slotPos(a.slot);a.x=s.x;a.y=s.y;}
    else if(a.state==='rot'){if(now-a.rt>2300)a.state='gone';}
  }
  updateCan(now,dt);
  for(const c of clouds){c.x+=c.v*dt;if(c.x>LW+30)c.x=-30;}
  // draw
  g.drawImage(bg,0,0);
  drawSun(t);
  for(const c of clouds)drawCloud(c);
  drawButterfly(t, -1);
  g.drawImage(trunk,trunkX,trunkY);
  g.drawImage(canopy,cox+shakeX,coy);
  const focusA=ptr.drag?null:(kbFocus||hover);
  for(const a of apples)if(a.state==='tree'&&!(a.grow>0&&a.grow<.5))drawApple(g,a.x,a.y+(a===focusA?-1:0),a.p.pal,a===focusA?'#fff':'#2b1a10');
  for(const a of apples)if(a.p.grad&&a.state==='tree'&&!(a.grow>0&&a.grow<.5)){const ph=Math.floor(now/260+a.i*2)%4;if(ph<3){const X=Math.round(a.x)+5,Y=Math.round(a.y)-5;g.fillStyle='#fff6a8';g.fillRect(X,Y-(ph===1?2:1),1,ph===1?5:3);g.fillRect(X-(ph===1?2:1),Y,ph===1?5:3,1);g.fillStyle='#fff';g.fillRect(X,Y,1,1);}}
  drawBasket(now,focusA);
  for(const a of apples)if(a.state==='gone'||a.state==='rot'||(a.state==='tree'&&a.grow>0&&a.grow<.5)){ // little bud where an apple will regrow
    const bxp=Math.round(a.hx+shakeX),byp=Math.round(a.hy);g.fillStyle='#2b1a10';g.fillRect(bxp-1,byp-1,3,3);g.fillStyle=a.grow>0?'#ffd1e8':'#a5e66a';g.fillRect(bxp,byp,1,1);
    if(a.grow>0){g.fillStyle=a.p.pal.o;g.fillRect(bxp-1,byp,1,1);g.fillRect(bxp+1,byp,1,1);}}
  for(const a of apples)if(a.state==='ground')drawApple(g,a.x,a.y,a.p.pal,a===focusA?'#fff':'#2b1a10');
  for(const a of apples)if(a.state==='rot'){const k=(now-a.rt);g.globalAlpha=k>1500?Math.max(0,1-(k-1500)/800):1;
    drawApple(g,a.x,a.y+Math.min(2,Math.floor(k/700)),k>350?ROTTEN:a.p.pal,'#2b1a10');g.globalAlpha=1;
    if(k<1400&&Math.floor(k/250)%2===0){g.fillStyle='#7cc0ee';g.fillRect(Math.round(a.x)+5,Math.round(a.y)-6,1,2);g.fillRect(Math.round(a.x)+4,Math.round(a.y)-5,3,2);}}
  for(const a of apples)if(a.state==='fly'||a.state==='fall'||a.state==='drag')drawApple(g,a.x,a.y,a.p.pal,a.state==='drag'?'#fff':'#2b1a10');
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    if(p.k==='drop'){p.vy+=.12*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
      const X=Math.round(p.x),Y=Math.round(p.y);g.fillStyle='#3b8fd9';g.fillRect(X,Y,1,1);g.fillRect(X-1,Y+1,3,2);g.fillStyle='#bfe6ff';g.fillRect(X-1,Y+1,1,1);
      if((p.y>p.sy+6&&inCanopy(p.x,p.y)&&Math.random()<.08)||p.y>=gy+2){for(let k=0;k<3;k++)parts.push({k:'px',x:p.x,y:p.y,vx:(Math.random()-.5)*1.2,vy:-Math.random()*1.1,c:k?'#bfe6ff':'#7cc0ee',life:.5});parts.splice(i,1);}
      continue;}
    if(p.k==='leaf'){p.ph+=.08*dt;p.x+=(p.vx+Math.sin(p.ph)*.35)*dt;p.y+=p.vy*dt;if(p.y>=p.ground){p.y=p.ground;p.vy=0;p.vx=0;p.life-=.006*dt;}
      g.fillStyle=p.c;g.globalAlpha=Math.min(1,p.life*2);g.fillRect(Math.round(p.x),Math.round(p.y),Math.sin(p.ph)>0?2:1,1);}
    else{p.vy+=.05*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=.02*dt;g.globalAlpha=Math.max(0,Math.min(1,p.life*1.5));g.fillStyle=p.c;
      const X=Math.round(p.x),Y=Math.round(p.y);
      if(p.k==='star'){g.fillRect(X,Y-1,1,3);g.fillRect(X-1,Y,3,1);}else g.fillRect(X,Y,1,1);}
    g.globalAlpha=1;if(p.life<=0)parts.splice(i,1);}
  drawCan(now);
  updateCanTalk(now);
  drawButterfly(t, 1);
  if(focusA&&!busy&&!openApple)showTip(focusA);else if(!openApple)hideTip();
  requestAnimationFrame(frame);
}
function updateCan(now,dt){
  const ez=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;let pouring=false;
  if(can.state==='auto'){const k=now-can.t0,P=pourPos();
    if(k<600){const u=ez(k/600);can.x=can.fx+(P.x-can.fx)*u;can.y=can.fy+(P.y-can.fy)*u-14*Math.sin(u*Math.PI);can.tilt=0;}
    else if(k<2300){can.x=P.x;can.y=P.y;can.tilt+=(.75-can.tilt)*.15*dt;pouring=k>800;if(k>2100)onWatered();}
    else{can.tilt*=.8;if(k>2450){busy=false;returnCan();}}}
  else if(can.state==='drag'){const tip=canTip();const over=tip.x>cox&&tip.x<cox+canopy.width&&tip.y<coy+canopy.height*.55&&tip.y>coy-30;
    can.tilt+=((over?.75:0)-can.tilt)*.18*dt;if(over&&can.tilt>.5){pouring=true;can.pourMs+=16.67*dt;if(can.pourMs>1300)onWatered();}}
  else if(can.state==='return'){const H2=canHome(),k=Math.min(1,(now-can.t0)/550),u=ez(k);can.tilt*=.8;
    can.x=can.fx+(H2.x-can.fx)*u;can.y=can.fy+(H2.y-can.fy)*u-10*Math.sin(u*Math.PI);if(k>=1){can.state='home';can.tilt=0;can.x=H2.x;can.y=H2.y;}}
  if(pouring&&now-can.lastDrop>45){can.lastDrop=now;const tp=canTip();
    parts.push({k:'drop',x:tp.x+1,y:tp.y+1,sy:tp.y,vx:.35+Math.random()*.5,vy:.2+Math.random()*.4,life:1});
    if(Math.random()<.15)tone(1400+Math.random()*900,.03,'sine',.03);}
}
const CAN_LINES=['THE TREE IS <b>THIRSTY!</b> 💧','PLEASE <b>WATER ME</b> FIRST! 🌳','CLICK THE CAN TO <b>WATER</b> 💦'];
const canTalk=document.getElementById('canTalk');
function updateCanTalk(now){
  const show=!watered&&can.state==='home'&&!openApple&&!busy&&hover!=='can'&&!fin.classList.contains('on')&&!document.getElementById('booth').classList.contains('on');
  if(show){const i=Math.floor(now/2600)%CAN_LINES.length;if(canTalk.dataset.i!=i){canTalk.innerHTML=CAN_LINES[i];canTalk.dataset.i=i;}
    const tw=canTalk.offsetWidth||200;canTalk.style.left=Math.min(Math.max(can.x*S,tw/2+8),W-tw/2-8)+'px';canTalk.style.top=(can.y-17)*S+'px';canTalk.classList.add('on');}
  else canTalk.classList.remove('on');}
function drawCan(now){
  let wig=0,sc=1;const wk=now-canWiggleT;if(wk<1200&&can.state==='home')wig=Math.sin(wk/45)*.25*(1-wk/1200);
  if(!watered&&can.state==='home'&&!openApple){const cyc=(now%2600)/2600;
    if(cyc<.45){const u=cyc/.45;sc=1+.45*Math.sin(u*Math.PI);wig+=Math.sin(u*Math.PI*6)*.32*Math.sin(u*Math.PI);}}
  const hov=(hover==='can'||kbFocus==='can')&&(can.state==='home'||can.state==='drag');
  if(hov){ // white outline: redraw silhouette in white
    g.save();g.translate(Math.round(can.x),Math.round(can.y)-(can.state==='home'?1:0));g.rotate(can.tilt+wig);g.scale(sc,sc);
    g.fillStyle='#fff';CAN.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch!=='.'){g.fillRect(c-9,r-6,1,1);g.fillRect(c-7,r-6,1,1);g.fillRect(c-8,r-7,1,1);g.fillRect(c-8,r-5,1,1);}}));g.restore();}
  g.save();g.translate(Math.round(can.x),Math.round(can.y)+(hov&&can.state==='home'?-1:0));g.rotate(can.tilt+wig);g.scale(sc,sc);g.drawImage(canSprite,-8,-6);g.restore();
  // thirsty marker above the can
  if(!watered&&can.state==='home'&&!openApple){const bob=Math.floor(now/300)%2,x=Math.round(can.x),y=Math.round(can.y)-12-bob;
    g.fillStyle='#2b1a10';g.fillRect(x-2,y-1,5,6);g.fillRect(x-1,y-2,3,1);g.fillRect(x,y-3,1,1);
    g.fillStyle='#4f9bd9';g.fillRect(x-1,y,3,4);g.fillRect(x,y-1,1,1);g.fillRect(x-1,y-1,3,1);g.fillStyle='#bfe6ff';g.fillRect(x-1,y+1,1,1);}
}
function drawSun(t){const sx=LW-(portrait?18:26),sy=portrait?44:22,r=portrait?6:8;
  const on=Math.floor(t*2)%2;g.fillStyle='#ffe27a';
  for(let k=0;k<8;k++){const a=k*Math.PI/4+(on?Math.PI/8:0);for(let d=r+3;d<r+5;d++)g.fillRect(Math.round(sx+Math.cos(a)*d),Math.round(sy+Math.sin(a)*d),1,1);}
  circ(g,sx,sy,r,'#ffc83d');circ(g,sx-1,sy-1,r-2,'#ffdf5d');
  g.fillStyle='#8a4b0f';g.fillRect(sx-3,sy-1,1,2);g.fillRect(sx+2,sy-1,1,2);
  g.fillRect(sx-2,sy+2,1,1);g.fillRect(sx-1,sy+3,3,1);g.fillRect(sx+2,sy+2,1,1);
  g.fillStyle='#ff9e9e';g.fillRect(sx-5,sy+1,1,1);g.fillRect(sx+4,sy+1,1,1);}
function drawCloud(c){const x=Math.round(c.x),y=Math.round(c.y),s=c.s;
  const B=[[0,0,5],[6,-3,6],[13,-1,5],[7,2,5],[-4,2,3],[17,2,3]];
  for(const[a,b,r]of B)circ(g,x+a*s*1.4,y+b*s+1,Math.round(r*s+1),'#d6ebf7');
  for(const[a,b,r]of B)circ(g,x+a*s*1.4,y+b*s,Math.round(r*s+1),'#ffffff');}
function drawButterfly(t,layer){const bxp=tx+Math.sin(t*.37)*R*1.7,byp=cy-R*.2+Math.sin(t*.83)*R*.75+Math.cos(t*.29)*R*.3;
  if((Math.cos(t*.37)>0?1:-1)!==layer)return;
  const x=Math.round(bxp),y=Math.round(byp),open=Math.floor(t*8)%2;
  g.fillStyle='#ff7eb6';if(open){g.fillRect(x-2,y-1,2,2);g.fillRect(x+1,y-1,2,2);g.fillStyle='#ffd1e8';g.fillRect(x-2,y-1,1,1);g.fillRect(x+2,y-1,1,1);}
  else{g.fillRect(x-1,y-2,1,2);g.fillRect(x+1,y-2,1,2);}
  g.fillStyle='#2b1a10';g.fillRect(x,y-1,1,3);}
function drawBasket(now,focusA){
  const q=Math.max(0,1-(now-squashT)/220),sq=Math.sin(q*Math.PI)*q;
  const w=Math.round(bw*(1+.12*sq)),h=Math.round(bh*(1-.15*sq)),top=bBottom-h;
  // handle
  const rx=w*.42,ry=h*1.15;
  for(let a=Math.PI;a<=2*Math.PI;a+=.015){const c=Math.cos(a),s=Math.sin(a);
    g.fillStyle='#3d2414';g.fillRect(Math.round(bx+(rx+1)*c),Math.round(top+1+(ry+1)*s),1,1);
    g.fillStyle='#a36a32';g.fillRect(Math.round(bx+rx*c),Math.round(top+1+ry*s),1,1);
    g.fillStyle='#d9a066';g.fillRect(Math.round(bx+(rx-1)*c),Math.round(top+1+(ry-1)*s),1,1);}
  // interior
  g.fillStyle='#4a2c14';for(let dy=-2;dy<=1;dy++){const hw=Math.round((w/2-2)*Math.sqrt(1-((dy+.5)/2.6)**2));g.fillRect(bx-hw,top+dy,hw*2,1);}
  // apples inside (back row first)
  const ins=apples.filter(a=>a.state==='basket').sort((a,b)=>a.slot-b.slot);
  for(const a of ins)drawApple(g,a.x,a.y-(a===focusA?1:0),a.p.pal,a===focusA?'#fff':'#2b1a10');
  // body
  for(let r=0;r<h;r++){const hw=Math.round(w/2-r*(w*.12/h));const x0=bx-hw,x1=bx+hw;
    for(let x=x0;x<x1;x++){let col;
      if(x===x0||x===x1-1||r===h-1)col='#3d2414';
      else if(r===0)col='#e2ad70';else if(r===1)col='#b5793c';else if(r===2)col='#8a5a2b';
      else col=((Math.floor((x-bx+60)/3)+Math.floor((r-3)/2))&1)?'#c58b4c':'#a36a32';
      if(r>2&&r<h-1&&(r-3)%2===1&&((Math.floor((x-bx+60)/3))&1)&&(x-bx+60)%3===0)col='#7a4a22';
      g.fillStyle=col;g.fillRect(x,top+r,1,1);}}
  // tiny label tag
  g.fillStyle='#fff8e6';g.fillRect(bx-4,top+Math.floor(h/2),8,4);g.fillStyle='#e63946';
  g.fillRect(bx-1,top+Math.floor(h/2)+1,1,1);g.fillRect(bx+1,top+Math.floor(h/2)+1,1,1);g.fillRect(bx-2,top+Math.floor(h/2)+2,5,1);g.fillRect(bx-1,top+Math.floor(h/2)+3,3,1);
}
requestAnimationFrame(frame);
</script>
